name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run IPC test
        run: uv run python -B test_ipc.py -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      # Each backend is only type-checked for its own platform, so check both.
      # basedpyright bundles pywin32's stubs, so this runs on Linux.
      - name: basedpyright (Linux)
        run: uv run basedpyright --pythonplatform Linux

      - name: basedpyright (Windows)
        run: uv run basedpyright --pythonplatform Windows

  # Single check to require in branch rules, so the jobs above can change freely.
  test-result:
    name: test-result
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "test jobs: ${{ needs.test.result }}, lint: ${{ needs.lint.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.lint.result }}" = success
